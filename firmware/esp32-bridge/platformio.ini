[platformio]
; Only the classic ESP32 is a blocking alpha firmware target. The C3 profile
; remains opt-in until its separate pin-safety/HIL track is complete.
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 2.x keeps the LEDC API used by this bridge stable. Upgrade to
; core 3.x only with the corresponding API migration and hardware record.
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32-c3-supermini]
; Experimental native USB Serial/JTAG target. Keep opt-in until HIL confirms
; reset-line and pin-safety behavior.
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DPINOUT_ESP32_C3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
