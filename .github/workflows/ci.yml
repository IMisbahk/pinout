name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run build
      - name: Governed coffee-machine demo (Linux, Node 20 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: npm run demo:coffee
      - name: Documentation and catalog gate (Linux, Node 20 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: npm run docs:check
      - name: Format check (Linux, Node 20 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: npm run format:check

  python-sdk:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python SDK
        run: pip install -e .[dev]
      - name: Run Python SDK tests
        run: pytest tests -q
      - name: Install Python module SDK
        run: pip install -e ../python-module[dev]
      - name: Run Python module SDK tests
        run: pytest ../python-module/tests -q

  micropython-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate MicroPython bridge protocol (host-side)
        working-directory: firmware/micropython-bridge
        run: node validate.js

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile ESP32 firmware (compile-only)
        working-directory: firmware/esp32-bridge
        run: pio run -e esp32dev
      - name: Upload classic ESP32 firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-bridge-esp32dev
          path: |
            firmware/esp32-bridge/.pio/build/esp32dev/firmware.bin
            firmware/esp32-bridge/.pio/build/esp32dev/firmware.elf
          if-no-files-found: error
