[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinout"
version = "0.1.0"
description = "Python SDK for Pinout — the interface between intelligence and physical machines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Pinout and contributors" }]
keywords = ["hardware", "robotics", "iot", "automation", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware",
]

[project.optional-dependencies]
async = ["httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/pinoutlabs/pinout"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
